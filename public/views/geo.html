<div class="view-header" style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px;">
    <div class="brand-logo" style="display: flex; align-items: center; gap: 8px;">
        <img src="/assets/logo.png" alt="Hidrape Logo" style="height: 36px; width: auto; object-fit: contain;">
    </div>
    <div>
        <h1>Visão Geoespacial & Clima</h1>
        <p>Clima e localização da propriedade</p>
    </div>
</div>

<div class="bento-grid">
    <!-- Clima -->
    <div id="clima-card" class="card card-blue" style="grid-column: span 12; padding: 22px; display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
        <div style="display: flex; gap: 16px; align-items: center;">
            <span id="clima-icon" class="material-symbols-rounded" style="font-size: 3rem; color: var(--sys-accent);">routine</span>
            <div>
                <h2 style="font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-bottom: 4px;">Clima Local</h2>
                <h3 id="clima-cidade" style="font-size: 1rem; font-weight: 600;">Localizando...</h3>
                <span id="clima-umid" style="font-size: 0.85rem; opacity: 0.7;">Ar: --%</span>
            </div>
        </div>
        <p id="clima-temp" class="font-kpi" style="font-size: 3.5rem; line-height: 1;">--°C</p>
    </div>
</div>

<div class="card" style="margin-top:20px;padding:24px;min-height:520px;display:flex;flex-direction:column;gap:16px;">
    <h2 style="font-size:1rem;">Localização da propriedade</h2>
    <p id="ndvi-analysis-text" style="font-size:0.85rem;opacity:0.8;">Imagem de referência cartográfica. Não há levantamento do talhão, dados de NDVI ou diagnóstico térmico disponíveis.</p>
    <div id="farm-map" style="flex:1;min-height:280px;width:100%;border-radius:10px;overflow:hidden;background:var(--neutral-700);position:relative;z-index:1;"></div>
</div>
