<div class="auth-container">
    <div class="card auth-card" style="max-width: 400px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <svg viewBox="0 0 240 60" style="height: 44px; width: auto; margin-bottom: 12px;" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(30, 0)">
                    <text x="0" y="40" font-family="'Inter', sans-serif" font-weight="800" font-size="34" fill="#EAE0CF" letter-spacing="-1">HIDRA</text>
                    <text x="110" y="40" font-family="'Inter', sans-serif" font-weight="800" font-style="italic" font-size="34" fill="#94B4C1" letter-spacing="-2">PE</text>
                </g>
            </svg>
            <p style="color: var(--neutral-300); font-size: 0.9rem;">Recuperação de Senha</p>
        </div>
        
        <form id="forgot-form" autocomplete="on">
            <p style="color: var(--neutral-300); font-size: 0.85rem; text-align: center; margin-bottom: 24px; line-height: 1.5;">
                Digite seu e-mail cadastrado. Se ele existir em nossa base, enviaremos um link de recuperação.
            </p>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" class="form-control" required placeholder="seu@email.com">
            </div>
            
            <div id="forgot-msg" style="margin-bottom: 14px; display: none; text-align: center; font-size: 0.85rem; padding: 10px; border-radius: var(--radius-badge); background: var(--neutral-700);"></div>
            
            <button type="submit" class="btn-primary" style="margin-top: 8px;">Enviar Link</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem;">
            <a href="javascript:void(0)" data-route="login" style="color: var(--neutral-300); font-weight: 500; text-decoration: none;">← Voltar ao Login</a>
        </div>
    </div>
</div>
