<div class="auth-container">
    <div class="card auth-card" style="max-width: 480px;">
        <div class="auth-brand" style="text-align: center; margin-bottom: 32px;">
            <img src="/assets/logo.png" alt="Hidrape Logo" style="height: 44px; width: auto; margin-bottom: 12px; object-fit: contain;">
            <p style="color: var(--neutral-300); font-size: 0.9rem;">Comece a monitorar seu solo</p>
        </div>
        
        <form id="register-form" autocomplete="on">
            <div class="form-group">
                <label for="reg-nome">Nome Completo</label>
                <input type="text" id="reg-nome" name="name" autocomplete="name" class="form-control" required placeholder="João da Silva">
            </div>
            <div class="form-group">
                <label for="reg-email">E-mail</label>
                <input type="email" id="reg-email" name="email" autocomplete="email" class="form-control" required placeholder="joao@email.com">
            </div>
            <div class="form-group">
                <label for="reg-senha">Senha</label>
                <input type="password" id="reg-senha" name="password" autocomplete="new-password" class="form-control" required placeholder="Mínimo 6 caracteres" minlength="6">
            </div>
            
            <div style="display: flex; gap: 16px;">
                <div class="form-group" style="flex: 1;">
                    <label for="reg-estado">UF</label>
                    <select id="reg-estado" name="state" class="form-control" required>
                        <option value="" disabled selected>UF</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label for="reg-cidade">Cidade</label>
                    <select id="reg-cidade" name="city" class="form-control" required disabled>
                        <option value="" disabled selected>Selecione a UF primeiro</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-cultura">Cultura Primária</label>
                <select id="reg-cultura" class="form-control" required>
                    <option value="Milho">Milho</option>
                    <option value="Feijão">Feijão</option>
                    <option value="Hortaliças">Hortaliças</option>
                    <option value="Cana-de-açúcar">Cana-de-açúcar</option>
                    <option value="Personalizado">Outro (Personalizado)</option>
                </select>
            </div>

            <div id="reg-error" style="color: var(--color-dry); margin-bottom: 12px; display: none; font-size: 0.85rem;"></div>
            
            <button type="submit" class="btn-primary" style="margin-top: 12px;">Cadastrar</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem;">
            <span style="color: var(--neutral-300);">Já possui login?</span>
            <a href="#" data-route="login" style="color: var(--sys-accent); font-weight: 600; text-decoration: none; margin-left: 4px;">Faça Login</a>
        </div>
    </div>
</div>
