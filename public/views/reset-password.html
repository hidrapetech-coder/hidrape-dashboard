<div class="auth-container">
    <div class="card auth-card" style="max-width: 400px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <svg viewBox="0 0 240 60" style="height: 44px; width: auto; margin-bottom: 12px;" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(30, 0)">
                    <text x="0" y="40" font-family="'Inter', sans-serif" font-weight="800" font-size="34" fill="#EAE0CF" letter-spacing="-1">HIDRA</text>
                    <text x="110" y="40" font-family="'Inter', sans-serif" font-weight="800" font-style="italic" font-size="34" fill="#94B4C1" letter-spacing="-2">PE</text>
                </g>
            </svg>
            <p style="color: var(--neutral-300); font-size: 0.9rem;">Redefinir Senha</p>
        </div>
        
        <div id="reset-msg" style="margin-bottom: 14px; display: none; text-align: center; font-size: 0.85rem; padding: 10px; border-radius: var(--radius-badge); background: var(--neutral-700);"></div>

        <form id="reset-form" autocomplete="off">
            <div class="form-group">
                <label for="senha">Nova Senha</label>
                <input type="password" id="senha" name="senha" class="form-control" required placeholder="Mínimo 6 caracteres" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmaSenha">Confirme a Nova Senha</label>
                <input type="password" id="confirmaSenha" name="confirmaSenha" class="form-control" required placeholder="Repita a senha" minlength="6">
            </div>
            
            <button type="submit" class="btn-primary" style="margin-top: 12px;">Salvar Nova Senha</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem;">
            <a href="javascript:void(0)" data-route="login" style="color: var(--neutral-300); font-weight: 500; text-decoration: none;">Ir para Login</a>
        </div>
    </div>
</div>
