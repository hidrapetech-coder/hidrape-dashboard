name: Offline regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
      - run: npm test
      - run: npm run check:prisma
      - run: npm run build
      - run: node --check public/js/app.min.js
      - run: git diff --exit-code -- public/js/app.min.js public/css/style.min.css
      - run: npm audit --audit-level=high
